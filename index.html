<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Fishing - Official Developer Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #001524;
      color: #ECEFF1;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #001F38;
      padding: 36px 24px;
      border-radius: 16px;
      border: 1px solid #00E5FF33;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #00E5FF;
      margin-bottom: 12px;
      font-size: 28px;
      letter-spacing: 1px;
    }
    p {
      color: #90A4AE;
      line-height: 1.6;
      font-size: 15px;
      margin: 16px 0;
    }
    .links {
      margin-top: 24px;
    }
    a {
      display: inline-block;
      color: #00E676;
      text-decoration: none;
      font-weight: bold;
      background: rgba(0, 230, 118, 0.12);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #00E67666;
      transition: background 0.2s;
    }
    a:hover {
      background: rgba(0, 230, 118, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎣 Drone Fishing</h1>
    <p>Official developer portal for Drone Fishing. Pilot high-tech drones, cast precision lines across ponds, lakes, and open oceans, manage payload capacity, and embark on deep-sea expeditions.</p>
    <div class="links">
      <a href="app-ads.txt">View app-ads.txt</a>
    </div>
  </div>
</body>
</html>
